name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Deploy
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_DIRECTORY: ${{ vars.PROD_DIRECTORY }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes"
          $SSH "$PROD_USER@$PROD_HOST" "install -d -m 755 '$PROD_DIRECTORY/.docker'"
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            .docker/docker-compose.production.base.yml \
            .docker/docker-compose.production.image.yml \
            "$PROD_USER@$PROD_HOST:$PROD_DIRECTORY/.docker/"
          printf 'TELEGRAM_BOT_TOKEN=%s\nAPP_IMAGE=ghcr.io/%s:%s\n' \
            "$BOT_TOKEN" "$GITHUB_REPOSITORY" "$GITHUB_SHA" |
            $SSH "$PROD_USER@$PROD_HOST" "umask 077; cat > '$PROD_DIRECTORY/.env'"
          printf '%s' "$GHCR_TOKEN" |
            $SSH "$PROD_USER@$PROD_HOST" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          $SSH "$PROD_USER@$PROD_HOST" "cd '$PROD_DIRECTORY' && \
            docker compose -f .docker/docker-compose.production.base.yml \
              -f .docker/docker-compose.production.image.yml pull && \
            docker compose -f .docker/docker-compose.production.base.yml \
              -f .docker/docker-compose.production.image.yml up -d --remove-orphans"
